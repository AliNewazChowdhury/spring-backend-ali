name: Deploy Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/deploy.yml'
    paths-ignore:
      - 'etc/**'
      - 'var/log/**'
      - 'home/**'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Stop Backend Service
        run: sudo systemctl stop backend

      - name: Backup Current JAR
        run: |
          if [ -f /opt/backend-app/app.jar ]; then
            sudo cp /opt/backend-app/app.jar /opt/backend-app/app.jar.backup
          fi

      - name: Deploy JAR
        run: |
          sudo cp target/*.jar /opt/backend-app/app.jar
          sudo chown ubuntu:ubuntu /opt/backend-app/app.jar

      - name: Start Backend Service
        run: sudo systemctl start backend

      - name: Wait for Service
        run: sleep 10

      - name: Check Service Status
        run: sudo systemctl status backend

      - name: Health Check
        run: |
          for i in {1..5}; do
            if curl -f http://localhost:8080/health; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check failed"
          exit 1
      - name: Validate Deployment Path
        run: |
          if [[ ! "$PWD" =~ ^/home/ubuntu/actions-runner/_work ]]; then
            echo "Invalid working directory"
            exit 1
          fi